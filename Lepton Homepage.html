  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

-space:nowrap;\">Navicat<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"lepton-cta\" style=\"padding:20px clamp(22px,5vw,72px) 110px;\">\n    <div style=\"position:relative; overflow:hidden; max-width:1200px; margin:0 auto; border-radius:26px; padding:clamp(64px,9vw,120px) clamp(24px,6vw,80px); text-align:center; background:radial-gradient(120% 130% at 50% 0%, #12244A 0%, #0B1730 46%, #070E1F 100%); box-shadow:0 40px 90px -50px rgba(6,12,28,0.9);\">\n      <div style=\"position:absolute; left:50%; top:-30%; width:60%; height:120%; transform:translateX(-50%); background:radial-gradient(circle, rgba(91,141,239,0.28), rgba(7,14,31,0) 68%); pointer-events:none;\"><\u002Fdiv>\n      <h2 style=\"position:relative; margin:0 0 22px; font-size:clamp(34px,5vw,74px); font-weight:700; line-height:1.02; letter-spacing:-0.035em; color:#F4F7FF; text-wrap:balance;\">Your Next Better Decision <span style=\"color:#6E9BF6;\">Starts Here.<\u002Fspan><\u002Fh2>\n      <p style=\"position:relative; margin:0 auto 40px; max-width:520px; font-size:clamp(15px,1.2vw,18px); line-height:1.6; color:#96A2BC; text-wrap:pretty;\">Tell us the location problem. We will show you the data and the product that solves it.<\u002Fp>\n      <div style=\"position:relative; display:flex; align-items:center; justify-content:center; gap:16px; flex-wrap:wrap;\">\n        <a href=\"#\" style=\"display:inline-flex; align-items:center; gap:9px; background:var(--accent); color:#ffffff; font-weight:600; font-size:15px; padding:14px 28px; border-radius:999px; box-shadow:0 16px 34px -14px rgba(91,141,239,0.7);\" style-hover=\"filter:brightness(1.08);\">Talk to sales <span style=\"font-size:16px;\">→<\u002Fspan><\u002Fa>\n        <a href=\"#\" style=\"display:inline-flex; align-items:center; gap:9px; color:#EAEEF6; font-weight:600; font-size:15px; padding:14px 26px; border-radius:999px; border:1px solid rgba(255,255,255,0.22);\" style-hover=\"background:rgba(255,255,255,0.07); border-color:rgba(255,255,255,0.4);\">Explore products<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;accent&quot;: { &quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#5B8DEF&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;options&quot;: [&quot;#5B8DEF&quot;, &quot;#3E63DD&quot;, &quot;#22B8CF&quot;, &quot;#0A2540&quot;] },\n  &quot;railsVisible&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Motion&quot; },\n  &quot;motion&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;Standard&quot;, &quot;options&quot;: [&quot;Standard&quot;, &quot;Calm&quot;], &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Motion&quot; }\n}\">\nclass Component extends DCLogic {\n  renderVals() {\n    return {\n      setCanvas: (el) => { this.canvas = el; },\n      setHeroRot: (el) => { this.heroRot = el; }\n    };\n  }\n\n  _readParams() {\n    this.accent = this.props.accent || '#5B8DEF';\n    this.railsVisible = this.props.railsVisible !== false;\n    this.calm = (this.props.motion || 'Standard') === 'Calm';\n  }\n\n  componentDidMount() {\n    this._readParams();\n    const root = document.getElementById('lepton-page');\n    if (root && this.props.accent) root.style.setProperty('--accent', this.props.accent);\n    this.reduced = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);\n    this._initStats();\n    this._initTransform();\n    this._initHow();\n    this._initInd();\n    this._initHeroRotator();\n    this._wait();\n  }\n\n  componentDidUpdate(prev) {\n    if (prev.accent !== this.props.accent && this.props.accent) {\n      this.accent = this.props.accent;\n      const root = document.getElementById('lepton-page');\n      if (root) root.style.setProperty('--accent', this.props.accent);\n      if (this.accentCol) this.accentCol.set(this.props.accent);\n      if (this.pMat) this.pMat.color.set(this.props.accent);\n      if (this.arcMat) this.arcMat.color.set(this.props.accent);\n      if (this.icMat) this.icMat.color.set(this.props.accent);\n      if (this.rMat) this.rMat.color.set(this.props.accent);\n    }\n    if (prev.railsVisible !== this.props.railsVisible) this.railsVisible = this.props.railsVisible !== false;\n    if (prev.motion !== this.props.motion) this.calm = (this.props.motion || 'Standard') === 'Calm';\n  }\n\n  _initStats(retry) {\n    const els = [...document.querySelectorAll('#lepton-stats [data-count]')];\n    if (!els.length) {\n      if ((retry || 0) < 50) this._stimer = setTimeout(() => this._initStats((retry || 0) + 1), 80);\n      return;\n    }\n    const ease = (x) => 1 - Math.pow(1 - x, 3);\n    const run = () => {\n      els.forEach((el) => {\n        const target = +el.getAttribute('data-count');\n        const suf = el.getAttribute('data-suffix') || '';\n        const dur = 1600, t0 = performance.now();\n        const step = (now) => {\n          const p = Math.min(1, (now - t0) / dur);\n          el.textContent = Math.round(target * ease(p)) + suf;\n          if (p < 1) requestAnimationFrame(step);\n        };\n        requestAnimationFrame(step);\n      });\n    };\n    if (this.reduced) {\n      els.forEach((el) => { el.textContent = el.getAttribute('data-count') + (el.getAttribute('data-suffix') || ''); });\n      return;\n    }\n    const sec = document.getElementById('lepton-stats');\n    if (!sec) { run(); return; }\n    let done = false;\n    const check = () => {\n      if (done) return;\n      const r = sec.getBoundingClientRect();\n      const vh = window.innerHeight || 800;\n      if (r.top < vh * 0.9 && r.bottom > 0) { done = true; run(); return; }\n      this._statRaf = requestAnimationFrame(check);\n    };\n    check();\n  }\n\n  _initTransform(retry) {\n    const stage = document.getElementById('lepton-reduce');\n    const canvas = document.getElementById('lepton-reduce-canvas');\n    if (!stage || !canvas) {\n      if ((retry || 0) < 50) this._ttimer = setTimeout(() => this._initTransform((retry || 0) + 1), 80);\n      return;\n    }\n    const ctx = canvas.getContext('2d');\n    const acc = this._hexRgb(this.accent);\n    const dpr = Math.min(window.devicePixelRatio || 1, 2);\n    const setSize = () => {\n      const r = canvas.getBoundingClientRect();\n      this.rcW = r.width; this.rcH = r.height;\n      canvas.width = Math.max(1, r.width * dpr); canvas.height = Math.max(1, r.height * dpr);\n      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);\n    };\n    setSize();\n    const N = this.rcW < 620 ? 420 : 820;\n    const pts = [];\n    for (let k = 0; k < N; k++) pts.push({ nx: Math.random(), ny: 0.12 + Math.random() * 0.78, ph: Math.random() * Math.PI * 2 });\n    this._rro = new ResizeObserver(setSize); this._rro.observe(canvas);\n\n    const ease = (x) => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;\n    const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };\n    this._rp = 0;\n    const draw = (now) => {\n      const w = this.rcW, h = this.rcH; ctx.clearRect(0, 0, w, h);\n      const e = ease(this._rp), cx = w * 0.5, cy = h * 0.52;\n      ctx.fillStyle = '#A7AFBE';\n      for (let k = 0; k < pts.length; k++) {\n        const p = pts[k], sx = p.nx * w, sy = p.ny * h;\n        const dx = Math.sin(now * 0.0006 + p.ph) * 3 * (1 - e);\n        const dy = Math.cos(now * 0.0007 + p.ph) * 3 * (1 - e);\n        const x = sx + (cx - sx) * e + dx, y = sy + (cy - sy) * e + dy;\n        const a = 0.55 * (1 - smooth(0.55, 1, e));\n        if (a <= 0.01) continue;\n        ctx.globalAlpha = a; ctx.fillRect(x, y, 1.8, 1.8);\n      }\n      ctx.globalAlpha = 1;\n      // beams: the input labels stay, and connect down into the \"1\"\n      const beam = smooth(0.12, 0.72, e);\n      if (beam > 0.01) {\n        const anchors = [0.16, 0.38, 0.62, 0.84], y0 = h * 0.12;\n        for (let ix = 0; ix < anchors.length; ix++) {\n          const x0 = anchors[ix] * w;\n          ctx.strokeStyle = 'rgba(' + acc.r + ',' + acc.g + ',' + acc.b + ',' + (0.22 * beam) + ')';\n          ctx.lineWidth = 1;\n          ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(cx, cy); ctx.stroke();\n          const ph = ((now * 0.00016) + ix * 0.27) % 1;\n          const px = x0 + (cx - x0) * ph, py = y0 + (cy - y0) * ph;\n          ctx.fillStyle = 'rgba(' + acc.r + ',' + acc.g + ',' + acc.b + ',' + (0.85 * beam) + ')';\n          ctx.beginPath(); ctx.arc(px, py, 2.2, 0, 6.283); ctx.fill();\n        }\n      }\n    };\n\n    if (this.reduced) {\n      this._rp = 1; stage.classList.add('seen', 'collapsing', 'collapsed'); draw(0); return;\n    }\n\n    let started = false, collapseStart = null;\n    const loop = () => {\n      const now = performance.now();\n      if (collapseStart !== null) {\n        this._rp = Math.min(1, (now - collapseStart) / 1600);\n        if (this._rp > 0.04) stage.classList.add('collapsing');\n        if (this._rp > 0.66) stage.classList.add('collapsed');\n      }\n      draw(now);\n      if (collapseStart !== null && this._rp >= 1) { this._rRaf = null; return; }\n      this._rRaf = requestAnimationFrame(loop);\n    };\n    const trigger = () => {\n      if (started) return false;\n      const r = stage.getBoundingClientRect();\n      const vh = window.innerHeight || 800;\n      if (r.top < vh * 0.68 && r.bottom > 0) {\n        started = true;\n        window.removeEventListener('scroll', trigger, true);\n        stage.classList.add('seen');\n        this._rRaf = requestAnimationFrame(loop);\n        this._rT = setTimeout(() => { collapseStart = performance.now(); }, 400);\n        return true;\n      }\n      return false;\n    };\n    const poll = () => { if (started) return; if (!trigger()) this._rPoll = requestAnimationFrame(poll); };\n    this._tScroll = trigge
